server:
  port: ${GATEWAY_PORT:18080}

spring:
  application:
    name: small-rag-gateway
  cloud:
    consul:
      enabled: ${CONSUL_ENABLED:true}
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        # 网关不需要被其他服务发现；只消费 small-rag 实例
        register: ${CONSUL_REGISTER:false}
        prefer-ip-address: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
            # MCP Streamable HTTP 可能是长连接/流式响应
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:1h}
          routes:
            - id: small-rag-mcp
              uri: lb://small-rag
              predicates:
                - Path=/mcp,/mcp/**
  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    consul:
      enabled: ${CONSUL_ENABLED:true}

logging:
  level:
    org.springframework.cloud.gateway: INFO
