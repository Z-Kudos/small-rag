# 分布式模式 overlay（可选）
#
# 用法（需要 Docker Compose v2.24+，支持 !reset）：
#   docker compose -f compose.yaml -f compose.distributed.yaml build
#   docker compose -f compose.yaml -f compose.distributed.yaml up -d --scale small-rag=2
#
# 对外只暴露 gateway:18080；两个 small-rag 副本共用 /data 归档卷。
# Spring Cloud Gateway 通过 Consul + LoadBalancer 路由到 small-rag 副本，
# Spring Cloud Config Server 提供 native 文件系统配置。
# 生产多主机部署时，把 small_rag_data 换成 NFS/CephFS 等 RWX 卷。
name: small-rag

services:
  small-rag:
    # 只运行应用；Qdrant / Embedding 由下面的独立服务提供
    environment:
      SMALL_RAG_RUNTIME: app-only
      SMALL_RAG_DISTRIBUTED_ENABLED: "true"
      # 多副本无粘性会话：MCP 必须无状态，端点仍是 /mcp
      SMALL_RAG_MCP_PROTOCOL: STATELESS
      # 所有副本挂载同一个 small_rag_data 卷
      SMALL_RAG_ARCHIVE_SHARED: "true"
      SMALL_RAG_ENSURE_EMBEDDING_MODEL: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CONSUL_ENABLED: "true"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      # Spring Cloud Config：optional 前缀允许配置中心不可用时继续启动
      CONFIG_SERVER_ENABLED: "true"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      CONFIG_SERVER_FAIL_FAST: "false"
      EMBEDDING_BASE_URL: http://embedding:11434/v1
      SMALL_RAG_ARCHIVE_DIR: /data/documents
    # 端口由 gateway 统一暴露；多副本不能各自绑定宿主机端口
    ports: !reset []
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      embedding:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile

  qdrant:
    image: ${QDRANT_IMAGE:-docker.io/qdrant/qdrant:latest}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  consul:
    image: ${CONSUL_IMAGE:-docker.io/hashicorp/consul:1.20}
    restart: unless-stopped
    # 单节点 server（bootstrap-expect=1），数据落在命名卷；生产建议三节点
    command:
      - agent
      - -server
      - -bootstrap-expect=1
      - -client=0.0.0.0
      - -data-dir=/consul/data
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  embedding:
    image: small-rag:${APP_IMAGE_TAG:-0.0.3}
    restart: unless-stopped
    entrypoint: ["/app/start-llama.sh"]
    user: app
    environment:
      EMBEDDING_BIND_ADDR: 0.0.0.0
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-https://modelscope.cn/models/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/master/Qwen3-Embedding-0.6B-Q8_0.gguf}
      EMBEDDING_MODEL_PATH: /data/models/qwen3-embedding-0.6b-q8_0.gguf
      EMBEDDING_CTX_SIZE: ${EMBEDDING_CTX_SIZE:-8192}
    volumes:
      - embedding_models:/data/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 300s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: small-rag-config-server:${APP_IMAGE_TAG:-0.0.3}
    restart: unless-stopped
    volumes:
      - ./config-repo:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: small-rag-gateway:${APP_IMAGE_TAG:-0.0.3}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:18080"
    environment:
      CONSUL_ENABLED: "true"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-1h}
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      consul:
        condition: service_healthy
      small-rag:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080'"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  qdrant_data:
  redis_data:
  consul_data:
  embedding_models:
