# 分布式模式 overlay（可选）
#
# 用法（需要 Docker Compose v2.24+，支持 !reset）：
#   docker compose -f compose.yaml -f compose.distributed.yaml build
#   docker compose -f compose.yaml -f compose.distributed.yaml up -d --scale small-rag=2
#
# 对外只暴露 gateway:18080；两个 small-rag 副本共用 /data 归档卷。
# 生产多主机部署时，把 small_rag_data 换成 NFS/CephFS 等 RWX 卷。
name: small-rag

services:
  small-rag:
    # 只运行应用；Qdrant / Embedding 由下面的独立服务提供
    environment:
      SMALL_RAG_RUNTIME: app-only
      SMALL_RAG_DISTRIBUTED_ENABLED: "true"
      SMALL_RAG_ENSURE_EMBEDDING_MODEL: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMBEDDING_BASE_URL: http://embedding:11434/v1
      SMALL_RAG_ARCHIVE_DIR: /data/documents
    # 端口由 gateway 统一暴露；多副本不能各自绑定宿主机端口
    ports: !reset []
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy

  qdrant:
    image: ${QDRANT_IMAGE:-docker.io/qdrant/qdrant:latest}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  embedding:
    image: small-rag:${APP_IMAGE_TAG:-0.0.2}
    restart: unless-stopped
    entrypoint: ["/app/start-llama.sh"]
    user: app
    environment:
      EMBEDDING_BIND_ADDR: 0.0.0.0
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-https://modelscope.cn/models/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/master/Qwen3-Embedding-0.6B-Q8_0.gguf}
      EMBEDDING_MODEL_PATH: /data/models/qwen3-embedding-0.6b-q8_0.gguf
      EMBEDDING_CTX_SIZE: ${EMBEDDING_CTX_SIZE:-8192}
    volumes:
      - embedding_models:/data/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 300s

  gateway:
    image: ${HAPROXY_IMAGE:-docker.io/library/haproxy:2.9-alpine}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:18080"
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - small-rag

volumes:
  qdrant_data:
  redis_data:
  embedding_models:
