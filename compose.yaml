name: small-rag

services:
  small-rag:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.io/library/maven:3.9-eclipse-temurin-25}
        QDRANT_IMAGE: ${QDRANT_IMAGE:-docker.io/qdrant/qdrant:latest}
        JRE_IMAGE: ${JRE_IMAGE:-docker.io/library/eclipse-temurin:25-jre}
        LLAMA_CPP_TAG: ${LLAMA_CPP_TAG:-v0.9.0}
    image: small-rag:${APP_IMAGE_TAG:-0.0.2}
    restart: unless-stopped
    # 单容器只对外暴露一个端口：应用 18080
    ports:
      - "${APP_PORT:-18080}:18080"
    environment:
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://127.0.0.1:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-0.6b}
      # Qwen3-Embedding-0.6B 输出 1024 维，必须与 Qdrant 集合维度一致
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # Embedding HTTP 超时（毫秒）：防止服务假死时重建线程被永久占用
      EMBEDDING_CONNECT_TIMEOUT_MS: ${EMBEDDING_CONNECT_TIMEOUT_MS:-10000}
      EMBEDDING_READ_TIMEOUT_MS: ${EMBEDDING_READ_TIMEOUT_MS:-120000}
      # GGUF 模型下载地址（首次启动由 start-llama.sh 下载到 EMBEDDING_MODEL_PATH）
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-https://modelscope.cn/models/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/master/Qwen3-Embedding-0.6B-Q8_0.gguf}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-small_rag_text}
      # 留空表示不启用鉴权
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # 常规 Qdrant RPC（写入/删除/检索）deadline（毫秒）
      QDRANT_REQUEST_TIMEOUT_MS: ${QDRANT_REQUEST_TIMEOUT_MS:-30000}
      # true：启动时等待容器内 Embedding 服务就绪（模型由 start-llama.sh 下载）
      SMALL_RAG_ENSURE_EMBEDDING_MODEL: ${SMALL_RAG_ENSURE_EMBEDDING_MODEL:-true}
      # 切分策略：fixed | recursive | semantic | parent-child（默认 parent-child）
      CHUNK_STRATEGY: ${CHUNK_STRATEGY:-parent-child}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      CHUNK_AUTO_RECHUNK: ${CHUNK_AUTO_RECHUNK:-true}
      SMALL_RAG_ARCHIVE_DIR: ${SMALL_RAG_ARCHIVE_DIR:-/data/documents}
      # 多目录 Markdown 自动导入
      SMALL_RAG_SOURCES_ENABLED: ${SMALL_RAG_SOURCES_ENABLED:-false}
      SMALL_RAG_SOURCE_DIRS: ${SMALL_RAG_SOURCE_DIRS:-}
      SMALL_RAG_SOURCE_EXTENSIONS: ${SMALL_RAG_SOURCE_EXTENSIONS:-.md,.markdown}
      SMALL_RAG_SOURCE_EXCLUDE: "${SMALL_RAG_SOURCE_EXCLUDE:-**/node_modules/**,**/target/**,**/build/**}"
      SMALL_RAG_SOURCES_SKIP_HIDDEN: ${SMALL_RAG_SOURCES_SKIP_HIDDEN:-true}
      SMALL_RAG_SOURCES_FOLLOW_SYMLINKS: ${SMALL_RAG_SOURCES_FOLLOW_SYMLINKS:-false}
      SMALL_RAG_SOURCES_SCAN_ON_STARTUP: ${SMALL_RAG_SOURCES_SCAN_ON_STARTUP:-true}
      SMALL_RAG_SOURCES_SCAN_INTERVAL_SECONDS: ${SMALL_RAG_SOURCES_SCAN_INTERVAL_SECONDS:-300}
      SMALL_RAG_SOURCES_WATCH_ENABLED: ${SMALL_RAG_SOURCES_WATCH_ENABLED:-true}
      SMALL_RAG_SOURCES_WATCH_DEBOUNCE_SECONDS: ${SMALL_RAG_SOURCES_WATCH_DEBOUNCE_SECONDS:-5}
      SMALL_RAG_SOURCES_MAX_FILE_BYTES: ${SMALL_RAG_SOURCES_MAX_FILE_BYTES:-2097152}
      SMALL_RAG_SOURCES_MAX_FILES_PER_SCAN: ${SMALL_RAG_SOURCES_MAX_FILES_PER_SCAN:-0}
      SMALL_RAG_SOURCES_DELETE_MISSING: ${SMALL_RAG_SOURCES_DELETE_MISSING:-false}
      SMALL_RAG_SOURCES_DELETE_ORPHAN_ROOTS: ${SMALL_RAG_SOURCES_DELETE_ORPHAN_ROOTS:-false}
      SMALL_RAG_SOURCES_STATE_FILE: ${SMALL_RAG_SOURCES_STATE_FILE:-}
      # 异步重建看门狗（秒）：停滞只告警，硬超时中断线程；0 关闭
      REINDEX_STALL_TIMEOUT_SECONDS: ${REINDEX_STALL_TIMEOUT_SECONDS:-1800}
      REINDEX_HARD_TIMEOUT_SECONDS: ${REINDEX_HARD_TIMEOUT_SECONDS:-3600}
      REINDEX_CHECK_INTERVAL_SECONDS: ${REINDEX_CHECK_INTERVAL_SECONDS:-30}
      REINDEX_JOIN_TIMEOUT_SECONDS: ${REINDEX_JOIN_TIMEOUT_SECONDS:-10}
      # 硬超时撤销写权限后的宽限期（秒），到期强制释放任务锁
      REINDEX_RECOVERY_GRACE_SECONDS: ${REINDEX_RECOVERY_GRACE_SECONDS:-120}
      # 任务快照与任务锁存放在 Qdrant 的 <collection>_reindex_state 集合
      REINDEX_RESUME_ON_STARTUP: ${REINDEX_RESUME_ON_STARTUP:-true}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.75}
      PARENT_CHUNK_SIZE: ${PARENT_CHUNK_SIZE:-2000}
      CHILD_CHUNK_SIZE: ${CHILD_CHUNK_SIZE:-400}
    volumes:
      # Qdrant 数据 + Embedding 模型 + 文档归档
      - small_rag_data:/data
      # 需要导入宿主机 Markdown 目录时，用可选 override 启动：
      #   docker compose -f compose.yaml -f compose.sources.yaml up -d --build
      # 或在 .env 设置 SMALL_RAG_SOURCE_HOST 后执行 make up-sources。
      # 分散的多目录可直接加 -v：
      # - /host/notes:/data/sources/notes:ro
      # - /host/wiki:/data/sources/wiki:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 300s

volumes:
  small_rag_data:
