global
    log stdout format raw local0
    # Docker 内置 DNS，用于发现 --scale 后的多个 small-rag 副本
    resolvers docker
        nameserver dns 127.0.0.11:53

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    # MCP Streamable HTTP 可能是长连接/流式响应
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend mcp
    bind *:18080
    default_backend small_rag

backend small_rag
    balance roundrobin
    server-template app 4 small-rag:18080 check resolvers docker init-addr none
